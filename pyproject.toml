[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-microstructure-rl"
version = "0.1.0"
description = "Event-driven limit order book simulation, tabular RL optimal execution, and strategic market microstructure models."
authors = [
    {name = "Yash Kothari", email = "25b1309@iitb.ac.in"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pytest>=7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
